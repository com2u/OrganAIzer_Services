services:
  # Backend FastAPI service
  backend:
    build: ./backend
    container_name: organizer-backend
    ports:
      - "5263:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - OPENCLAW_BASE_URL=http://openclaw:18789
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - /app/__pycache__
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - organizer-network

  # Frontend service
  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_KEY=${VITE_API_KEY}
    container_name: organizer-frontend
    ports:
      - "5264:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - organizer-network

  # OpenClaw service
  openclaw:
    image: ghcr.io/openclaw/openclaw:2026.4.26
    container_name: organizer-openclaw
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
    volumes:
      - ./infra/openclaw/openclaw-data:/home/node/.openclaw
    restart: unless-stopped
    networks:
      - organizer-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp
      - /home/node/.cache

networks:
  organizer-network:
    driver: bridge

volumes:
  backend-data:
  frontend-data: