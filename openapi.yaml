openapi: 3.1.0
info:
  title: OrganAIzer Services API
  description: "\n    **OrganAIzer Services** - Comprehensive AI-powered backend API\n\
    \    \n    ## Features\n    \n    * **Text-to-Speech (TTS)** - Convert text to\
    \ natural speech using Google TTS\n    * **Speech-to-Text (STT)** - Transcribe\
    \ audio files to text\n    * **Image Generation** - Create images from text prompts\
    \ (Vertex AI Imagen & Gemini)\n    * **Video Transcription** - Transcribe videos\
    \ from YouTube, URLs, or uploads\n    * **AI Chat** - LLM chat completions via\
    \ OpenRouter (Gemini, Claude, GPT, etc.)\n    * **Document Analysis** - Upload,\
    \ summarize, and chat with documents (PDF, DOCX, TXT, MD)\n    * **Translation**\
    \ - Translate text, audio, and files between 30+ languages\n    * **Knowledge\
    \ Base (RAG)** - Semantic search and Q&A over your content\n    * **Integrations**\
    \ - Google and Outlook integration (Calendar, Mail) - BETA\n    \n    ## Technology\
    \ Stack\n    \n    * FastAPI for high-performance API\n    * Google AI (Gemini,\
    \ Vertex AI) for advanced AI capabilities\n    * OpenRouter for multi-model LLM\
    \ access\n    * TF-IDF vectorization for semantic search\n    * FFmpeg for audio/video\
    \ processing\n    \n    All services are designed for production use with comprehensive\
    \ error handling,\n    logging, and monitoring capabilities.\n    "
  contact:
    name: OrganAIzer Services
    url: https://github.com/com2u/OrganAIzer_Services
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: 1.0.0
paths:
  /api/tts/generate:
    post:
      tags:
      - Text-to-Speech
      summary: Generate Speech
      description: "Generates speech from markdown-formatted text.\n\nProcesses the\
        \ input through the following steps:\n1. Normalizes markdown to plain text\n\
        2. Detects language\n3. Preprocesses text for natural speech\n4. Synthesizes\
        \ speech and saves as MP3\n\nUsed by the frontend to convert user-provided\
        \ markdown text into downloadable audio.\n\nArgs:\n    request: Request containing\
        \ markdown text\n    \nReturns:\n    Response with normalized text, detected\
        \ language, and audio download URL\n    \nRaises:\n    AppError: If any step\
        \ in the TTS pipeline fails"
      operationId: generate_speech_api_tts_generate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TTSGenerateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TTSGenerateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/tts/audio/{audio_id}:
    get:
      tags:
      - Text-to-Speech
      summary: Get Audio
      description: "Downloads a generated MP3 audio file by its ID.\n\nRetrieves the\
        \ MP3 file from temporary storage and returns it with appropriate headers.\n\
        Used by the frontend to download or play generated audio files.\n\nArgs:\n\
        \    audio_id: Unique identifier of the audio file (UUID)\n    \nReturns:\n\
        \    FileResponse containing the MP3 audio file\n    \nRaises:\n    AppError:\
        \ If the audio file is not found"
      operationId: get_audio_api_tts_audio__audio_id__get
      parameters:
      - name: audio_id
        in: path
        required: true
        schema:
          type: string
          title: Audio Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/stt/transcribe:
    post:
      tags:
      - Speech-to-Text
      summary: Transcribe Speech
      description: "Transcribes an audio file to text using OpenAI Whisper.\n\nProcesses\
        \ the uploaded audio through:\n1. File validation (format and size checks)\n\
        2. Audio transcription using Whisper model with optional language hint\n3.\
        \ Language detection\n4. Duration extraction\n\nProviding a language hint\
        \ can significantly improve transcription accuracy,\nespecially for English\
        \ ('en') and German ('de') content.\n\nUsed by the frontend to convert audio\
        \ files into text transcripts.\n\nArgs:\n    file: Uploaded audio file (supports\
        \ MP3, WAV, M4A, OGG, FLAC formats)\n    language: Optional language code\
        \ hint (e.g., 'en', 'de', 'es', 'fr')\n    \nReturns:\n    Response with transcribed\
        \ text, detected language, and audio duration\n    \nRaises:\n    AppError:\
        \ If file validation or transcription fails"
      operationId: transcribe_speech_api_stt_transcribe_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_transcribe_speech_api_stt_transcribe_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/STTTranscribeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/image-gen/generate:
    post:
      tags:
      - Image Generation
      summary: Generate Images
      description: "Generate images from a text prompt using Vertex AI Imagen.\n\n\
        Args:\n    request: Image generation request containing prompt and parameters\n\
        \nReturns:\n    ImageGenerateResponse with generated image URLs\n\nRaises:\n\
        \    HTTPException: If image generation fails"
      operationId: generate_images_api_image_gen_generate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageGenerateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageGenerateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/image-gen/image/{image_id}:
    get:
      tags:
      - Image Generation
      summary: Get Image
      description: "Retrieve a generated image by its ID.\n\nArgs:\n    image_id:\
        \ UUID of the generated image\n\nReturns:\n    FileResponse with the image\
        \ file\n\nRaises:\n    HTTPException: If image not found"
      operationId: get_image_api_image_gen_image__image_id__get
      parameters:
      - name: image_id
        in: path
        required: true
        schema:
          type: string
          title: Image Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/nano-banana/generate:
    post:
      tags:
      - Image Generation
      summary: Generate Nano Banana Images
      description: "Generate images using Gemini 2.5 Flash Image (nano banana).\n\n\
        Args:\n    request: Nano banana generation request containing prompt\n\nReturns:\n\
        \    NanoBananaResponse with generated image data\n\nRaises:\n    HTTPException:\
        \ If image generation fails"
      operationId: generate_nano_banana_images_api_nano_banana_generate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NanoBananaRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NanoBananaResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/nano-banana/image/{image_id}:
    get:
      tags:
      - Image Generation
      summary: Get Nano Banana Image
      description: "Retrieve a nano banana generated image by its ID.\n\nArgs:\n \
        \   image_id: UUID of the generated image\n\nReturns:\n    FileResponse with\
        \ the image file\n\nRaises:\n    HTTPException: If image not found"
      operationId: get_nano_banana_image_api_nano_banana_image__image_id__get
      parameters:
      - name: image_id
        in: path
        required: true
        schema:
          type: string
          title: Image Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/youtube/transcribe:
    post:
      tags:
      - YouTube
      summary: Transcribe Youtube
      description: "Transcribes a YouTube video to text.\n\nDownloads the audio from\
        \ the provided YouTube URL and transcribes it\nusing OpenRouter's audio-capable\
        \ AI model.\n\nProcess:\n1. Downloads audio from YouTube using yt-dlp\n2.\
        \ Transcribes audio using OpenRouter API (gpt-4o-audio-preview)\n3. Returns\
        \ the transcript\n\nQuality Modes:\n- fast: Lower audio quality (64kbps),\
        \ smaller files, faster processing\n- accurate: Higher audio quality (128kbps),\
        \ better transcription accuracy\n\nUsed by the frontend to convert YouTube\
        \ videos into text transcripts.\n\nArgs:\n    body: Request containing the\
        \ YouTube URL and quality mode\n    \nReturns:\n    Response with the original\
        \ URL and transcribed text\n    \nRaises:\n    AppError: If download or transcription\
        \ fails"
      operationId: transcribe_youtube_api_youtube_transcribe_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/YoutubeTranscribeRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YoutubeTranscribeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/video/transcribe:
    post:
      tags:
      - Video Transcription
      summary: Transcribe Video Endpoint
      description: "Unified endpoint for transcribing videos from multiple sources.\n\
        \nSupports three input types:\n1. YouTube URL - Downloads and transcribes\
        \ YouTube videos\n2. Generic video URL - Downloads and transcribes videos\
        \ from direct links\n3. File upload - Transcribes user-uploaded video files\n\
        \nProcess:\n1. Validates input based on source type\n2. Downloads/receives\
        \ video file\n3. Extracts audio using ffmpeg (for URL and upload types)\n\
        4. Transcribes audio using Whisper or OpenRouter\n5. Returns transcript and\
        \ metadata\n\nArgs:\n    source_type: Type of video source\n    video_url:\
        \ URL to video (for youtube and url types)\n    language_preference: Language\
        \ hint for better accuracy\n    quality_mode: Transcription quality mode\n\
        \    file: Uploaded video file (for upload type)\n    \nReturns:\n    Response\
        \ with transcript and detected language\n    \nRaises:\n    AppError: If transcription\
        \ fails or invalid input provided"
      operationId: transcribe_video_endpoint_api_video_transcribe_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_transcribe_video_endpoint_api_video_transcribe_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoTranscribeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/chat/completion:
    post:
      tags:
      - chat
      summary: Chat Completion
      description: "Generate a chat completion using an LLM via OpenRouter.\n\nArgs:\n\
        \    request: ChatRequest with prompt and optional parameters\n\nReturns:\n\
        \    ChatResponse with AI's response"
      operationId: chat_completion_api_chat_completion_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/chat/models:
    get:
      tags:
      - chat
      summary: Get Available Models
      description: "Get list of available LLM models from OpenRouter.\n\nReturns:\n\
        \    AvailableModelsResponse with current model and available models"
      operationId: get_available_models_api_chat_models_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailableModelsResponse'
  /api/documents/upload:
    post:
      tags:
      - documents
      summary: Upload Document
      description: 'Upload and process a document.


        Supports:

        - PDF files

        - DOCX files

        - TXT files

        - MD (Markdown) files


        The document will be:

        1. Text extracted

        2. Chunked for processing

        3. Language detected

        4. Stored with unique ID


        Returns document ID and metadata for further operations.'
      operationId: upload_document_api_documents_upload_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_document_api_documents_upload_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentUploadResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/documents/summarize:
    post:
      tags:
      - documents
      summary: Summarize Document
      description: 'Generate summary and key points for a document.


        Uses LLM to create:

        - Concise summary (adjustable length)

        - Key points/highlights as bullet list


        Results are cached for faster subsequent access.'
      operationId: summarize_document_api_documents_summarize_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentSummaryRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSummaryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/documents/chat:
    post:
      tags:
      - documents
      summary: Chat With Document
      description: 'Ask questions about a document (Q&A mode).


        Uses RAG (Retrieval-Augmented Generation):

        1. Finds relevant document sections

        2. Uses them as context for LLM

        3. Generates accurate, document-based answer


        Supports conversation history for follow-up questions.'
      operationId: chat_with_document_api_documents_chat_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentChatRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentChatResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/documents/list:
    get:
      tags:
      - documents
      summary: List Documents
      description: 'List all uploaded documents.


        Returns basic info for each document including:

        - Document ID

        - Filename

        - Text preview

        - Metadata

        - Cached summary (if available)'
      operationId: list_documents_api_documents_list_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentListResponse'
  /api/documents/{document_id}:
    get:
      tags:
      - documents
      summary: Get Document
      description: 'Get document information by ID.


        Returns full document metadata and cached analysis results.'
      operationId: get_document_api_documents__document_id__get
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          title: Document Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentInfo'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - documents
      summary: Delete Document
      description: 'Delete a document by ID.


        Removes document and all associated data.'
      operationId: delete_document_api_documents__document_id__delete
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          title: Document Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDeleteResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/translate/text:
    post:
      tags:
      - translation
      summary: Translate Text
      description: 'Translate text to target language.


        Features:

        - Auto-detects source language if not provided

        - High-quality LLM-based translation

        - Supports 30+ languages


        The translation uses context-aware LLM processing for natural,

        accurate translations.'
      operationId: translate_text_api_translate_text_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextTranslationRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextTranslationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/translate/audio:
    post:
      tags:
      - translation
      summary: Translate Audio
      description: 'Translate audio file to target language.


        Process:

        1. Transcribe audio (STT)

        2. Detect source language

        3. Translate to target language

        4. Optionally generate TTS audio


        This integrates OrganAIzer''s STT, translation, and TTS capabilities

        into a complete audio translation pipeline.'
      operationId: translate_audio_api_translate_audio_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_translate_audio_api_translate_audio_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioTranslationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/translate/file:
    post:
      tags:
      - translation
      summary: Translate File
      description: 'Translate text file to target language.


        Supports:

        - .txt files

        - .md (Markdown) files


        Returns translated text with detected source language.'
      operationId: translate_file_api_translate_file_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_translate_file_api_translate_file_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileTranslationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/translate/detect:
    post:
      tags:
      - translation
      summary: Detect Language
      description: 'Detect the language of given text.


        Uses langdetect library for fast, accurate language detection.

        Supports 50+ languages.'
      operationId: detect_language_api_translate_detect_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextTranslationRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LanguageDetectionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/translate/languages:
    get:
      tags:
      - translation
      summary: Get Supported Languages
      description: 'Get list of supported languages.


        Returns language codes and names for all supported languages.

        Use these codes for the target_language and source_language parameters.'
      operationId: get_supported_languages_api_translate_languages_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportedLanguagesResponse'
  /api/kb/add:
    post:
      tags:
      - knowledge-base
      summary: Add Content
      description: 'Add content to the knowledge base.


        Content can be:

        - Notes

        - Document summaries

        - Transcriptions

        - Any text you want to remember


        The content will be:

        1. Chunked for optimal search

        2. Indexed for semantic search

        3. Available for RAG chat'
      operationId: add_content_api_kb_add_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KBAddRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KBAddResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/kb/search:
    post:
      tags:
      - knowledge-base
      summary: Search Knowledge Base
      description: 'Search the knowledge base.


        Uses semantic search (TF-IDF + cosine similarity) to find

        relevant content chunks.


        Features:

        - Semantic similarity matching

        - Adjustable result count

        - Minimum score filtering

        - Source type filtering'
      operationId: search_knowledge_base_api_kb_search_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KBSearchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KBSearchResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/kb/chat:
    post:
      tags:
      - knowledge-base
      summary: Chat With Knowledge Base
      description: 'Chat with your knowledge base using RAG.


        This is OrganAIzer''s memory - ask questions and get answers

        based on everything you''ve stored.


        Process:

        1. Search for relevant content

        2. Use as context for LLM

        3. Generate accurate, sourced answer


        Supports conversation history for follow-up questions.'
      operationId: chat_with_knowledge_base_api_kb_chat_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KBChatRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KBChatResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/kb/list:
    get:
      tags:
      - knowledge-base
      summary: List Knowledge Base Contents
      description: 'List all content in the knowledge base.


        Returns summary information for each content item including:

        - Content ID and title

        - Content preview

        - Source type

        - Number of chunks

        - Metadata'
      operationId: list_knowledge_base_contents_api_kb_list_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KBListResponse'
  /api/kb/{content_id}:
    delete:
      tags:
      - knowledge-base
      summary: Delete Knowledge Base Content
      description: 'Delete content from the knowledge base.


        This will:

        1. Remove the content

        2. Rebuild the search index'
      operationId: delete_knowledge_base_content_api_kb__content_id__delete
      parameters:
      - name: content_id
        in: path
        required: true
        schema:
          type: string
          title: Content Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KBDeleteResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/kb/reindex:
    post:
      tags:
      - knowledge-base
      summary: Reindex Knowledge Base
      description: 'Rebuild the knowledge base search index.


        Use this to:

        - Recover from index corruption

        - Optimize search performance

        - Apply index updates


